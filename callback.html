<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>もしもシリーズ Uploader 連携</title>
<style>
:root{--bg:#f6f7f5;--surface:#fff;--ink:#1b211e;--muted:#5c6762;--line:#d8dfdb;--accent:#2a7f62}
@media (prefers-color-scheme: dark){:root{--bg:#121614;--surface:#1a201d;--ink:#e6ece9;--muted:#9aa7a1;--line:#2b3430;--accent:#6fd3ad;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;padding:32px max(16px,env(safe-area-inset-left,0px))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
code{font:15px/1.5 ui-monospace,monospace;word-break:break-all;user-select:all}
button{font:700 15px system-ui;padding:9px 16px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer;align-self:flex-start}
.muted{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>TikTok との連携</h1>
  <div class="box" id="ok" hidden>
    <p>許可ありがとうございます。下のコードを Claude とのチャットに貼ってください（数分で使えなくなります）。</p>
    <code id="code"></code>
    <button type="button" id="copy">コピー</button>
    <p class="muted" id="msg"></p>
  </div>
  <div class="box" id="ng" hidden>
    <p>連携できませんでした：<span id="err"></span></p>
    <p class="muted">もう一度、Claude から送られた連携用のリンクを開いてください。</p>
  </div>
  <p class="muted"><a href="terms.html">Terms of Service</a> ・ <a href="privacy.html">Privacy Policy</a></p>
</main>
<script>
const q = new URLSearchParams(location.search);
const code = q.get('code');
if (code) {
  document.getElementById('ok').hidden = false;
  document.getElementById('code').textContent = code;
  document.getElementById('copy').onclick = () =>
    navigator.clipboard.writeText(code).then(() => { document.getElementById('msg').textContent = 'コピーしました'; },
      () => { document.getElementById('msg').textContent = 'コードを長押し（または選択）してコピーしてください'; });
} else {
  document.getElementById('ng').hidden = false;
  document.getElementById('err').textContent = q.get('error_description') || q.get('error') || 'コードがありません';
}
</script>
</body>
</html>
